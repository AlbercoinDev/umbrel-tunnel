id: albercoin-store-umbrel-tunnel
storage:
  dataRoot: data
category: networking
name: Umbrel Tunnel
version: "1.4.0"
tagline: Expose Umbrel services through your own VPS over WireGuard
icon: "data:image/svg+xml;base64,"
description: >-
  Umbrel Tunnel connects your Umbrel to a VPS with a fixed public IP through a
  WireGuard tunnel. The app detects installed apps and UmbrelOS services, lets
  you choose which ports to expose, and opens or closes the matching public
  ports on the VPS. The VPS control API only listens inside the tunnel and is
  protected by a Bearer token. The interface is available in Spanish (default)
  and English, and follows the browser/UmbrelOS language on first open.


  Requirements: a Debian 12/13 or Ubuntu Server 22.04/24.04+ VPS (amd64/arm64)
  with a fixed public IP. Run the one-line installer on the VPS, then paste the
  pairing code in the app.
releaseNotes: >-
  Port detection is now dynamic: the app classifies every port of every app
  (web dashboard, RPC, P2P, ZMQ, Electrum, Lightning, metrics, database, TCP or
  UDP) from the Compose files, environment and command flags, plus a bounded
  active TCP/HTTP scan of the Docker network. Ports are no longer read from a
  static catalog. Web services are published by subdomain on ports 80/443
  instead of their internal port: the VPS routes by Host and the local proxy
  forwards to the real container port. HTTP/HTTPS public ports are fixed;
  TCP/UDP/TLS keep a custom public port. The services table has a type column,
  type filter, internal/sensitive badges and an option to hide internal ports.
  The base domain and certificate section is reorganized into two columns.
  Unknown apps remain available through the manual service form.
