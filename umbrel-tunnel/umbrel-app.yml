manifestVersion: 1
id: umbrel-tunnel
name: Umbrel Tunnel
tagline: Expón servicios de Umbrel a través de tu VPS con WireGuard
icon: https://raw.githubusercontent.com/umbrel-tunnel/umbrel-tunnel/main/umbrel-tunnel/images/icon.svg
category: Networking
version: "1.0.0"
port: 8081
description: >-
  Crea un túnel WireGuard entre tu Umbrel y un VPS con IP fija. La app detecta
  las aplicaciones instaladas y los servicios de UmbrelOS, y te permite abrir
  sus puertos en el VPS desde la interfaz. La API del VPS solo es accesible a
  través del túnel y está protegida con un token.
developer: umbrel-tunnel
website: https://github.com/umbrel-tunnel/umbrel-tunnel
dependencies: []
repo: https://github.com/umbrel-tunnel/umbrel-tunnel
support: https://github.com/umbrel-tunnel/umbrel-tunnel/issues
gallery: []
releaseNotes: >-
  Primera versión: detección automática de apps, emparejamiento ut1, proxy TCP
  local y apertura/cierre de puertos en el VPS.
torOnly: false
