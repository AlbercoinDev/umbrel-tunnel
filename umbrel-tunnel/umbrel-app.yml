manifestVersion: 1.1
id: albercoin-store-umbrel-tunnel
storage:
  dataRoot: data
category: networking
name: Umbrel Tunnel
version: "1.3.2"
tagline: Expose Umbrel services through your own VPS over WireGuard
icon: "data:image/svg+xml;base64,"
description: >-
  Umbrel Tunnel connects your Umbrel to a VPS with a fixed public IP through a
  WireGuard tunnel. The app detects installed apps and UmbrelOS services, lets
  you choose which ports to expose, and opens or closes the matching public
  ports on the VPS. The VPS control API only listens inside the tunnel and is
  protected by a Bearer token. The interface is available in Spanish (default)
  and English, and follows the browser/UmbrelOS language on first open.


  Requirements: a Debian 12/13 or Ubuntu Server 22.04/24.04+ VPS (amd64/arm64)
  with a fixed public IP. Run the one-line installer on the VPS, then paste the
  pairing code in the app.
releaseNotes: >-
  Update the VPS to 1.3.2 before updating this app. A VPS on 1.3.1 or older
  cannot update itself without --from yet, so pass the release URL once:
  sudo umbrel-tunnel update --from
  https://github.com/AlbercoinDev/umbrel-tunnel/releases/latest/download/umbrel-tunnel-linux-$(dpkg --print-architecture)
  From 1.3.2 on, "umbrel-tunnel update" installs the latest release by itself,
  verifies the checksum and that the new binary runs, refreshes the systemd
  units and prints the old and new versions.
  If the binary cannot run it restores the previous one; if the restart fails it
  prints the journal tail. doctor now reports the binary version, the unit
  capabilities, the required public ports and the reachability of the endpoint.
  Certificates are not requested when the VPS cannot bind the needed ports, and
  failed issuance names the blocked ports. When a certificate fails, the app
  also checks ports 80/443 from your Umbrel network, which exposes a provider
  firewall the VPS cannot see. Requires wildcard DNS pointing to the VPS in
  DNS-only mode and TCP 80 for ACME; HTTPS also requires TCP 443.
developer: AlbercoinDev
