services:
  wireguard:
    image: linuxserver/wireguard:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ./wireguard:/config
    restart: unless-stopped

  api:
    build: ./api
    network_mode: host
    cap_add:
      - NET_ADMIN
    depends_on:
      - wireguard
    volumes:
      - ./wireguard:/wireguard-config
    environment:
      - WG_CONFIG_DIR=/wireguard-config
      - API_PORT=8080
      - VPS_PUBLIC_IP=${VPS_PUBLIC_IP:-}
    restart: unless-stopped
