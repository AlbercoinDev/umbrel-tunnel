name: Gateway image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/umbrel-tunnel-gateway
          tags: |
            type=raw,value=${{ inputs.tag || '1.0.0' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: umbrel-tunnel/gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest
        run: |
          echo "Published tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Pin the index digest from:"
          echo "docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/umbrel-tunnel-gateway:${{ github.ref_name }}"
