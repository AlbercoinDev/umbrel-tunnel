name: Gateway image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: "0.6.8"
      push:
        description: Push the image to GHCR (false builds only)
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/umbrel-tunnel-gateway
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.tag || '0.6.8' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: umbrel-tunnel/gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest
        run: |
          echo "Published tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Pin the index digest from:"
          echo "docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/umbrel-tunnel-gateway:${{ steps.meta.outputs.version }}"
