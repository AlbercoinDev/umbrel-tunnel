name: VPS release

# Publishes the static binaries used by install.sh and by
# `umbrel-tunnel update --from .../releases/latest/download/...`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the VPS binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vps
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: vps/go.mod
          cache: false

      - name: Check the tag matches VERSION
        run: test "$(tr -d ' \n' < VERSION)" = "${GITHUB_REF_NAME#v}"

      - name: Test
        run: go test ./...

      - name: Build release artifacts
        run: make dist

      - name: Sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.VPS_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "falta el secreto VPS_RELEASE_SIGNING_KEY"; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release-signing.key"
          chmod 600 "$RUNNER_TEMP/release-signing.key"
          openssl pkeyutl -sign -rawin \
            -inkey "$RUNNER_TEMP/release-signing.key" \
            -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/release-signing.key"

      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            vps/dist/umbrel-tunnel-linux-amd64 \
            vps/dist/umbrel-tunnel-linux-amd64.sha256 \
            vps/dist/umbrel-tunnel-linux-arm64 \
            vps/dist/umbrel-tunnel-linux-arm64.sha256 \
            vps/dist/umbrel-tunnel-*-linux-*.tar.gz \
            vps/dist/SHA256SUMS \
            vps/dist/SHA256SUMS.sig \
            vps/release-signing.pub.pem \
            vps/install.sh \
            --clobber
